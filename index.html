<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF1F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1422" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tagalong">
<meta name="description" content="Tagalong: a shared family packing list that syncs between phones.">
<title>Tagalong – Family packing lists</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M10 4h18a2 2 0 012 2v20a2 2 0 01-2 2H10L2 20v-8z' fill='%23F7C531'/%3E%3Ccircle cx='9' cy='16' r='3' fill='%2313203A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #EDF1F5; --card: #FFFFFF; --ink: #13203A; --muted: #5A6478; --line: #D9E0E8; --soft: #F5F7FA;
  --tag: #F7C531; --tag-deep: #DFAA12; --tag-ink: #13203A;
  --go: #17936A; --go-soft: #DAF1E7; --danger: #C23048; --focus: #2F6FDB;
  --display: "Bricolage Grotesque", ui-rounded, system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #0D1422; --card: #162033; --ink: #E7ECF4; --muted: #9AA5B8; --line: #27334B;
          --soft: #1B2640; --go: #3CC08E; --go-soft: #173A2E; --danger: #F06B80; --focus: #7FAEFF; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body { margin: 0; overflow-x: hidden; }
body { background: var(--paper); color: var(--ink); font: 17px/1.45 var(--body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }
.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.app { max-width: 560px; margin: 0 auto; padding: 0 16px calc(120px + env(safe-area-inset-bottom)); }

/* Top bar */
.topbar { display: flex; align-items: center; gap: 8px; padding: calc(12px + env(safe-area-inset-top)) 0 12px; }
.wordmark { display: flex; align-items: center; gap: 8px; font: 800 24px/1 var(--display); letter-spacing: -0.02em; margin-right: auto; }
.wordmark svg { width: 30px; height: 22px; }
.back { display: inline-flex; align-items: center; gap: 2px; background: none; border: 0; padding: 8px 8px 8px 0; font-weight: 700; margin-right: auto; text-decoration: none; color: var(--ink); }
.icon-btn { width: 42px; height: 42px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; color: var(--ink); }
.icon-btn:hover { background: var(--soft); }
.icon-btn:disabled { opacity: .3; cursor: default; background: none; }
.me { display: inline-grid; place-items: center; border: 2px solid var(--line); background: var(--card); border-radius: 50%; padding: 2px; flex: none; }
.me .av { width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: var(--paper); display: grid; place-items: center; font: 800 14px var(--display); flex: none; }
.local-pill { border: 1.5px dashed var(--line); background: none; border-radius: 99px; padding: 5px 10px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.saving { font-size: 13px; color: var(--muted); }

/* Luggage tag */
.tag { position: relative; display: block; background: var(--tag); color: var(--tag-ink); text-decoration: none;
  padding: 20px 20px 18px 62px; border-radius: 20px;
  clip-path: polygon(30px 0, 100% 0, 100% 100%, 30px 100%, 0 calc(100% - 30px), 0 30px); }
.tag::before { content: ""; position: absolute; left: 17px; top: 50%; width: 20px; height: 20px; margin-top: -10px; border-radius: 50%; background: var(--paper); box-shadow: 0 0 0 5px var(--tag-deep); }
.tag::after { content: ""; position: absolute; left: 49px; top: 14px; bottom: 14px; border-left: 2px dashed rgba(19,32,58,.22); }
.tag-from { font-size: 15px; font-weight: 700; opacity: .72; }
.tag-to { font: 800 clamp(36px, 10.5vw, 56px)/.95 var(--display); letter-spacing: -0.035em; margin: 4px 0 12px; text-wrap: balance; overflow-wrap: anywhere; }
.tag-when { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; font-weight: 700; }
.countdown { background: var(--tag-ink); color: var(--tag); border-radius: 99px; padding: 3px 11px; font-size: 14px; }
.tag-progress { margin-top: 16px; padding-top: 12px; border-top: 2px dashed rgba(19,32,58,.25); }
.tag-progress .line { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-weight: 700; }
.tag-progress .big { font: 800 22px/1 var(--display); letter-spacing: -0.02em; }
.bar { height: 8px; border-radius: 99px; background: rgba(19,32,58,.14); margin-top: 8px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--tag-ink); border-radius: 99px; transition: width .4s ease; }
.tag.mini { padding: 16px 18px 14px 56px; margin-bottom: 14px; }
.tag.mini .tag-to { font-size: clamp(28px, 8vw, 38px); margin: 2px 0 10px; }
.tag.mini::before { left: 15px; width: 18px; height: 18px; margin-top: -9px; }
.tag.mini::after { left: 44px; }
.tag.mini.past { filter: saturate(.35); opacity: .8; }

.trip-notes { color: var(--muted); font-size: 15px; padding: 12px 4px 0; white-space: pre-wrap; margin: 0; }

/* Hint card */
.hint { display: flex; gap: 12px; align-items: flex-start; background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; padding: 14px; margin-top: 16px; }
.hint p { margin: 0 0 10px; }
.hint .grow { flex: 1; }

/* Travelers */
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 6px; margin: 20px 0 4px; }
.person { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 2px solid transparent; border-radius: 16px; padding: 8px 2px 6px; min-width: 0; }
.person.on { background: var(--card); border-color: var(--c); }
.ring { width: 56px; height: 56px; border-radius: 50%; padding: 4px; background: conic-gradient(var(--c) calc(var(--p) * 1%), var(--line) 0); }
.ring .av { width: 100%; height: 100%; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font: 800 19px var(--display); border: 3px solid var(--paper); }
.person.on .ring .av { border-color: var(--card); }
.person .pname { font-weight: 700; font-size: 15px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.person .pleft { font-size: 13px; color: var(--muted); margin-top: -3px; }
.person .pleft.done { color: var(--go); font-weight: 700; }

/* Toolbar */
.toolbar { position: sticky; top: 0; z-index: 10; background: var(--paper); padding: 10px 0 8px; display: grid; gap: 8px; }
.seg { display: flex; background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 3px; }
.seg button { flex: 1; border: 0; background: none; border-radius: 10px; padding: 8px 6px; font-weight: 700; font-size: 15px; color: var(--muted); }
.seg button.on { background: var(--ink); color: var(--paper); }
.search { position: relative; }
.search .ico { position: absolute; left: 12px; top: 50%; margin-top: -10px; width: 20px; height: 20px; color: var(--muted); pointer-events: none; }
.search input { width: 100%; border: 1.5px solid var(--line); background: var(--card); border-radius: 14px; padding: 10px 12px 10px 40px; font-size: 16px; }
.filter-note { display: flex; align-items: center; gap: 10px; background: var(--card); border-left: 5px solid var(--c); border-radius: 12px; padding: 10px 12px; margin-top: 4px; font-size: 15px; }
.filter-note b { flex: 1; }
.textbtn { background: none; border: 0; padding: 6px 4px; font-weight: 700; color: var(--focus); }

/* Categories */
.cat { margin-top: 20px; }
.cat-head { width: 100%; display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 4px 2px; text-align: left; }
.cat-icon { width: 38px; height: 38px; border-radius: 11px; background: var(--card); border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 20px; flex: none; }
.cat-name { flex: 1; font: 700 20px/1.15 var(--display); letter-spacing: -0.015em; }
.cat-count { font-size: 14px; color: var(--muted); font-weight: 700; white-space: nowrap; }
.cat-count.done { color: var(--go); }
.chev { color: var(--muted); transition: transform .2s; }
.cat.collapsed .chev { transform: rotate(-90deg); }
.cat-body { background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; margin-top: 8px; overflow: hidden; }

/* Items */
.item { display: flex; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); align-items: flex-start; }
.item:first-child { border-top: 0; }
.check { flex: none; width: 32px; height: 32px; border-radius: 50%; border: 2px solid #A7B1C0; background: transparent; display: grid; place-items: center; padding: 0; margin-top: -2px; }
.check svg { width: 17px; height: 17px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; stroke-dashoffset: 24; }
.item.done .check { background: var(--go); border-color: var(--go); }
.item.done .check svg { stroke-dashoffset: 0; }
.item.partial .check { border-color: var(--go); background: conic-gradient(var(--go) calc(var(--p) * 1%), transparent 0); }
.item.pop .check { animation: pop .28s ease; }
.item.pop.done .check svg { animation: tick .3s ease .05s both; }
@keyframes pop { 40% { transform: scale(1.18); } }
@keyframes tick { from { stroke-dashoffset: 24; } to { stroke-dashoffset: 0; } }
.col { flex: 1; min-width: 0; }
.main { cursor: pointer; border-radius: 8px; }
.iname { font-weight: 700; overflow-wrap: anywhere; }
.item.done .iname { color: var(--muted); }
.imeta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 2px; font-size: 14px; color: var(--muted); }
.qty { font-weight: 700; color: var(--ink); }
.item.done .qty { color: var(--muted); }
.bag { border: 1.5px solid var(--line); border-radius: 6px; padding: 0 6px; font-size: 13px; }
.by { color: var(--go); }
.inote { font-size: 14px; color: var(--muted); margin-top: 4px; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.pchip { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--line); border-radius: 99px; padding: 3px 11px 3px 4px; font-weight: 700; font-size: 14px; background: var(--card); max-width: 100%; }
.pchip .dot { width: 22px; height: 22px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font: 800 11px var(--display); flex: none; }
.pchip .dot svg { width: 13px; height: 13px; fill: none; stroke: #fff; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
.pchip.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, var(--card)); }
.pchip span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.add-row { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; border-top: 1px solid var(--line); background: none; padding: 12px 14px; color: var(--muted); font-weight: 700; font-size: 15px; text-align: left; }
.cat-body .add-row:first-child { border-top: 0; }

.empty { text-align: center; padding: 48px 16px; color: var(--muted); }
.empty .em { font-size: 40px; display: block; margin-bottom: 8px; }
.empty b { display: block; color: var(--ink); font: 700 20px var(--display); margin-bottom: 4px; }

.fab { position: fixed; z-index: 20; right: max(16px, calc(50vw - 264px)); bottom: calc(22px + env(safe-area-inset-bottom)); width: 62px; height: 62px; border-radius: 50%; border: 0; background: var(--tag); color: var(--tag-ink); display: grid; place-items: center; box-shadow: 0 10px 26px rgba(13,20,34,.32), inset 0 0 0 2px rgba(19,32,58,.08); }
.fab .ico { width: 28px; height: 28px; stroke-width: 2.6; }

/* Home */
.page-title { font: 800 40px/1 var(--display); letter-spacing: -0.035em; margin: 18px 0 18px; }
.notice { background: var(--card); border: 1.5px dashed var(--line); border-radius: 16px; padding: 14px 16px; color: var(--muted); font-size: 15px; margin-bottom: 18px; }
.notice b { color: var(--ink); }
.new-trip { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 22px; border: 2px dashed var(--line); background: none; border-radius: 20px; font: 700 18px var(--display); color: var(--ink); }
.section-label { font: 700 16px var(--display); color: var(--muted); margin: 28px 0 10px; }

/* Sheets */
dialog.sheet { border: 0; padding: 0; width: 100%; max-width: 560px; max-height: 92vh; margin: auto auto 0; border-radius: 24px 24px 0 0; background: var(--card); color: var(--ink); box-shadow: 0 -10px 40px rgba(13,20,34,.25); }
dialog.sheet[open] { animation: up .24s ease; }
@keyframes up { from { transform: translateY(40px); opacity: .4; } }
@media (min-width: 640px) { dialog.sheet { margin: auto; border-radius: 24px; } }
dialog.sheet::backdrop { background: rgba(9,14,26,.48); }
.sheet-inner { display: flex; flex-direction: column; max-height: 92vh; }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 18px 16px 4px 20px; }
.sheet-head h2 { flex: 1; margin: 0; font: 800 24px/1.1 var(--display); letter-spacing: -0.02em; }
.sheet-body { padding: 4px 20px 18px; overflow-y: auto; overscroll-behavior: contain; }
.sheet-body > p { color: var(--muted); margin: 6px 0 0; }
.sheet-foot { display: flex; gap: 10px; align-items: center; padding: 12px 20px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
.field { margin-top: 16px; }
.field > label, .field > .label { display: block; font-weight: 700; font-size: 15px; margin-bottom: 6px; }
.field .help { font-size: 14px; color: var(--muted); margin: -2px 0 8px; }
.sheet input:not([type=radio]), .sheet select, .sheet textarea { width: 100%; font-size: 17px; padding: 11px 12px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--paper); }
.sheet textarea { resize: vertical; min-height: 64px; }
.sheet input.invalid { border-color: var(--danger); }
.row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.row2 .field { min-width: 0; }
.sheet input[type=date] { min-width: 0; min-height: 50px; }
.btn { flex: 1; padding: 13px 16px; border-radius: 14px; border: 0; font-weight: 700; font-size: 16px; background: var(--ink); color: var(--paper); }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.danger { background: var(--danger); color: #fff; }
.btn.small { flex: none; padding: 9px 14px; font-size: 15px; }
.btn.block { width: 100%; margin-top: 10px; }
.btn.yellow { background: var(--tag); color: var(--tag-ink); }
.del-link { background: none; border: 0; color: var(--danger); font-weight: 700; padding: 10px 4px; margin-right: auto; }
.stepper { display: flex; align-items: center; gap: 12px; }
.stepper button { width: 46px; height: 46px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--paper); font-size: 22px; font-weight: 700; }
.stepper .num { font: 800 26px var(--display); min-width: 36px; text-align: center; }
.stepper .total { color: var(--muted); font-size: 15px; }
.te-row, .ce-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.te-row input { flex: 1; min-width: 0; }
.sheet .te-row select { width: auto; flex: none; padding-right: 6px; }
.te-color { width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--card); box-shadow: 0 0 0 1.5px var(--line); background: var(--c); flex: none; }
.ce-row { gap: 4px; }
.ce-row input { flex: 1; min-width: 0; margin: 0 4px; }
.ce-row .icon-btn { width: 36px; height: 36px; }
.ce-emoji { width: 46px; height: 46px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--paper); font-size: 22px; flex: none; }
.emoji-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 4px; background: var(--paper); border-radius: 12px; padding: 8px; margin: 6px 0 4px; }
.emoji-grid button { border: 0; background: none; font-size: 24px; padding: 6px 0; border-radius: 8px; }
.emoji-grid button:hover { background: var(--card); }
.choice { display: flex; gap: 12px; align-items: flex-start; border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-top: 8px; cursor: pointer; }
.choice:has(input:checked) { border-color: var(--ink); background: var(--paper); }
.choice input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--ink); }
.choice b { display: block; }
.choice span { color: var(--muted); font-size: 15px; }
.name-pick { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.divider { border: 0; border-top: 1px solid var(--line); margin: 22px 0 6px; }
.danger-zone { display: grid; gap: 8px; margin-top: 10px; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); z-index: 50; background: var(--ink); color: var(--paper); border-radius: 14px; padding: 12px 14px 12px 16px; font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100vw - 32px); width: max-content; }
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { background: none; border: 0; color: inherit; text-decoration: underline; text-underline-offset: 3px; font-weight: 800; padding: 2px 4px; }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module">
/* ─────────────────────────────────────────────────────────────
   SETUP
   1. Paste your Firebase web config below (Firebase console →
      Project settings → Your apps). Leave it null to try the app
      in "this phone only" mode, saved in the browser.
   2. HOUSEHOLD groups your family's trips in Firestore:
      households/{HOUSEHOLD}/trips/{tripId}/items/{itemId}
   ───────────────────────────────────────────────────────────── */
const FIREBASE_CONFIG = null;
/* e.g.
const FIREBASE_CONFIG = {
  apiKey: "…", authDomain: "…", projectId: "…",
  storageBucket: "…", messagingSenderId: "…", appId: "…"
};
*/
const HOUSEHOLD = "our-family";
const FIREBASE_VERSION = "10.12.2";

/* ── Constants ─────────────────────────────────────────────── */
const COLORS = ["#2F6FDB", "#D9466F", "#11998E", "#7A4FE0", "#E07B16", "#56657E", "#2E9E4F", "#B0427F"];
const EMOJI = ["🧳","🎒","👕","🧥","👟","🩳","🧢","🪥","🧴","🩹","💊","🌙","🧸","🍼","🪪","🎟️","🏰","🏖️","🏊","⛷️","🏕️","🚗","✈️","🔌","📱","📷","🍎","🐶","📝","🎁","⚽","🎣","☂️","❄️","📦"];
const BAGS = ["Carry-on", "Checked bag", "Kids' backpacks", "Gate-check", "Wear it"];
const DEFAULT_TRAVELERS = [
  { id: "t_dad", name: "Dad", kind: "adult", color: COLORS[0] },
  { id: "t_mom", name: "Mom", kind: "adult", color: COLORS[1] },
  { id: "t_kid1", name: "Kid 1", kind: "kid", color: COLORS[2] },
  { id: "t_kid2", name: "Kid 2", kind: "kid", color: COLORS[3] }
];
const PLACEHOLDER_NAMES = new Set(["Kid 1", "Kid 2"]);
const CATEGORIES = [
  { id: "c_before", name: "Before you leave", icon: "📝", tripOnly: true },
  { id: "c_docs", name: "Documents & money", icon: "🪪" },
  { id: "c_gear", name: "Car seats & strollers", icon: "🚗" },
  { id: "c_park", name: "Disney day", icon: "🏰", tripOnly: true },
  { id: "c_kids", name: "Kids' clothes", icon: "👕" },
  { id: "c_adults", name: "Adult clothes", icon: "🧥" },
  { id: "c_toilet", name: "Toiletries", icon: "🪥" },
  { id: "c_health", name: "Health", icon: "🩹" },
  { id: "c_sleep", name: "Bedtime", icon: "🌙" },
  { id: "c_carry", name: "Carry-on", icon: "🎒" },
  { id: "c_tech", name: "Electronics", icon: "🔌" },
  { id: "c_beach", name: "Beach", icon: "🏖️" }
];
// [category, item, qty, who (F = whole family, K = each kid, A = each adult), bag, note]
const SEED = [
  ["c_before", "Check in for the flight", 1, "F", "", "Check-in usually opens 24 hours before departure"],
  ["c_before", "Download shows and games onto the tablets", 1, "F", "", "Plane Wi-Fi is unreliable"],
  ["c_before", "Charge tablets, phones and the power bank", 1, "F", "", "Sunday night"],
  ["c_before", "Hold the mail or ask a neighbor", 1, "F", "", ""],
  ["c_before", "Turn down the thermostat and take out the trash", 1, "F", "", ""],

function put(el, ...kids) {
  el.replaceChildren(...kids.flat(Infinity).filter((k) => k != null && k !== false && k !== ""));
}
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k === "html") el.innerHTML = v;
    else if (k === "value") el.value = v;
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else if (typeof v === "boolean" && k in el) el[k] = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c.nodeType ? c : String(c));
  }
  return el;
}

const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function parseD(s) { if (!s) return null; const [y, m, d] = s.split("-").map(Number); return y ? new Date(y, m - 1, d) : null; }
function fmtRange(a, b) {
  const s = parseD(a), e = parseD(b);
  if (!s) return "Add dates";
  const f = (d) => `${MON[d.getMonth()]} ${d.getDate()}`;
  if (!e || +e === +s) return f(s);
  if (s.getMonth() === e.getMonth() && s.getFullYear() === e.getFullYear()) return `${f(s)}–${e.getDate()}`;
  return `${f(s)} – ${f(e)}`;
}
function countdown(a, b) {
  const s = parseD(a); if (!s) return "";
  const e = parseD(b) || s, t = new Date(); t.setHours(0, 0, 0, 0);
  const toStart = Math.round((s - t) / 864e5), toEnd = Math.round((e - t) / 864e5);
  if (toStart > 1) return `Leaves in ${toStart} days`;
  if (toStart === 1) return "Leaves tomorrow";
  if (toStart === 0) return "Leaving today";
  if (toEnd >= 0) return `Day ${1 - toStart} of ${Math.round((e - s) / 864e5) + 1}`;
  return "Back home";
}
const isPast = (trip) => { const e = parseD(trip.end || trip.start); if (!e) return false; const t = new Date(); t.setHours(0,0,0,0); return e < t; };

/* ── Data stores ───────────────────────────────────────────── */
// Same interface for both: watchTrips, watchTrip, watchItems, createTrip, updateTrip,
// deleteTrip, addItem, updateItem, deleteItem, setPacked, bulk.

function LocalStore() {
  const KEY = "tagalong-data-v1";
  const load = () => { try { return JSON.parse(lsGet(KEY)) || { trips: {} }; } catch (e) { return { trips: {} }; } };
  let db = load();
  const subs = new Set();
  const bc = "BroadcastChannel" in window ? new BroadcastChannel("tagalong") : null;
  const emit = () => subs.forEach((s) => s());
  if (bc) bc.onmessage = () => { db = load(); emit(); };
  const save = () => { lsSet(KEY, JSON.stringify(db)); if (bc) bc.postMessage(1); emit(); };
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const sub = (fn) => { subs.add(fn); queueMicrotask(fn); return () => subs.delete(fn); };
  const items = (t) => db.trips[t] ? db.trips[t].items : {};
  return {
    mode: "local",
    watchTrips: (cb) => sub(() => cb(Object.entries(db.trips).map(([id, t]) => ({ id, ...clone(t.data) })), { fromCache: false })),
    watchTrip: (id, cb) => sub(() => cb(db.trips[id] ? { id, ...clone(db.trips[id].data) } : null)),
    watchItems: (id, cb) => sub(() => cb(Object.entries(items(id)).map(([iid, it]) => ({ id: iid, ...clone(it) })), {})),
    async createTrip(id, data, list) { db.trips[id] = { data: clone(data), items: Object.fromEntries(list.map(([i, it]) => [i, clone(it)])) }; save(); },
    async updateTrip(id, patch) { if (db.trips[id]) { Object.assign(db.trips[id].data, clone(patch)); save(); } },
    async deleteTrip(id) { delete db.trips[id]; save(); },
    async addItem(t, i, item) { if (db.trips[t]) { db.trips[t].items[i] = clone(item); save(); } },
    async updateItem(t, i, patch) { const it = items(t)[i]; if (it) { Object.assign(it, clone(patch)); save(); } },
    async deleteItem(t, i) { delete items(t)[i]; save(); },
    async setPacked(t, i, key, by) { const it = items(t)[i]; if (!it) return; it.packed = it.packed || {}; if (by) it.packed[key] = by; else delete it.packed[key]; save(); },
    async bulk(t, ops) { const all = items(t); for (const op of ops) { if (op.del) delete all[op.id]; else if (all[op.id]) Object.assign(all[op.id], clone(op.patch)); } save(); }
  };
}

async function FirebaseStore(config) {
  const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}`;
  const { initializeApp } = await import(`${base}/firebase-app.js`);
  const fs = await import(`${base}/firebase-firestore.js`);
  const app = initializeApp(config);
  let db;
  try { db = fs.initializeFirestore(app, { localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) }); }
  catch (e) { db = fs.getFirestore(app); }
  const tripsCol = fs.collection(db, "households", HOUSEHOLD, "trips");
  const tripRef = (id) => fs.doc(tripsCol, id);
  const itemsCol = (id) => fs.collection(tripRef(id), "items");
  const itemRef = (t, i) => fs.doc(itemsCol(t), i);
  async function commit(ops) {
    for (let i = 0; i < ops.length; i += 400) { const b = fs.writeBatch(db); ops.slice(i, i + 400).forEach((fn) => fn(b)); await b.commit(); }
  }
  return {
    mode: "cloud",
    watchTrips: (cb, err) => fs.onSnapshot(tripsCol, { includeMetadataChanges: true }, (s) => cb(s.docs.map((d) => ({ id: d.id, ...d.data() })), { fromCache: s.metadata.fromCache }), err),
    watchTrip: (id, cb, err) => fs.onSnapshot(tripRef(id), (d) => cb(d.exists() ? { id: d.id, ...d.data() } : null), err),
    watchItems: (id, cb, err) => fs.onSnapshot(itemsCol(id), { includeMetadataChanges: true }, (s) => cb(s.docs.map((d) => ({ id: d.id, ...d.data() })), { pending: s.metadata.hasPendingWrites }), err),
    createTrip: (id, data, list) => commit([(b) => b.set(tripRef(id), data), ...list.map(([i, it]) => (b) => b.set(itemRef(id, i), it))]),
    updateTrip: (id, patch) => fs.updateDoc(tripRef(id), patch),
    async deleteTrip(id) { const s = await fs.getDocs(itemsCol(id)); await commit([...s.docs.map((d) => (b) => b.delete(d.ref)), (b) => b.delete(tripRef(id))]); },
    addItem: (t, i, item) => fs.setDoc(itemRef(t, i), item),
    updateItem: (t, i, patch) => fs.updateDoc(itemRef(t, i), patch),
    deleteItem: (t, i) => fs.deleteDoc(itemRef(t, i)),
    setPacked: (t, i, key, by) => fs.updateDoc(itemRef(t, i), { [`packed.${key}`]: by ? by : fs.deleteField() }),
    bulk: (t, ops) => commit(ops.map((op) => op.del ? (b) => b.delete(itemRef(t, op.id)) : (b) => b.update(itemRef(t, op.id), op.patch)))
  };
}

/* ── Trip building ─────────────────────────────────────────── */
function buildItems(rows, travelers, withNotes) {
  const kids = travelers.filter((t) => t.kind === "kid").map((t) => t.id);
  const adults = travelers.filter((t) => t.kind === "adult").map((t) => t.id);
  const out = [];
  rows.forEach(([cat, name, qty, w, bag, note], i) => {
    let who = "shared";
    if (w === "K") { if (!kids.length) return; who = [...kids]; }
    if (w === "A") { if (!adults.length) return; who = [...adults]; }
    out.push(["i" + String(i + 1).padStart(3, "0"), { name, cat, qty, who, bag, note: withNotes ? note : "", packed: {}, order: (i + 1) * 10 }]);
  });
  return out;
}
const cleanCats = (cats) => cats.map(({ tripOnly, ...c }) => c);

function seedFirstTrip() {
  const id = "california-2026";

}

/* ── Packing logic ─────────────────────────────────────────── */
const traveler = (id) => (S.trip && S.trip.travelers || []).find((t) => t.id === id);
function keysFor(it) {
  if (!Array.isArray(it.who)) return ["shared"];
  const ids = it.who.filter((id) => traveler(id));
  return ids.length ? ids : ["shared"];
}
const isDone = (it) => keysFor(it).every((k) => it.packed && it.packed[k]);
const viewKeys = (it) => S.tf ? [S.tf] : keysFor(it);
const isDoneView = (it) => viewKeys(it).every((k) => it.packed && it.packed[k]);

function toggle(it, keys) {
  const packed = { ...(it.packed || {}) };
  const allOn = keys.every((k) => packed[k]);
  const who = S.me || "Someone";
  S.justToggled = it.id;
  if (!allOn && navigator.vibrate) navigator.vibrate(8);
  if (keys.length === 1) return write(S.store.setPacked(S.tripId, it.id, keys[0], allOn ? null : who));
  for (const k of keys) { if (allOn) delete packed[k]; else if (!packed[k]) packed[k] = who; }
  write(S.store.updateItem(S.tripId, it.id, { packed }));
}

  S.unsub.push(S.store.watchTrip(id, (t) => {
    if (!t) { S.trip = null; S.tripMissing = true; renderTrip(); return; }
    S.trip = t; S.tripMissing = false; renderTrip();
    if (!S.me && !S.askedMe) { S.askedMe = true; setTimeout(openMeSheet, 400); }
  }, onErr));
  S.unsub.push(S.store.watchItems(id, (items, meta) => { S.items = items; S.itemsReady = true; S.pending = !!(meta && meta.pending); renderTrip(); }, onErr));
}

function buildShell() {
  const seg = h("div", { class: "seg", role: "group", "aria-label": "Show" },
    [["todo", "To pack"], ["packed", "Packed"], ["all", "All"]].map(([v, label]) =>
      h("button", { type: "button", "data-v": v, onclick: () => { S.filter = v; lsSet("tagalong-filter", v); renderTrip(); } }, label)));
  const search = h("input", { type: "search", placeholder: "Search this list", "aria-label": "Search this list", value: S.q,
    oninput: (e) => { S.q = e.target.value; renderTrip(); } });
  slots = {
    status: h("span", { class: "saving" }),
    tag: h("div"), notes: h("div"), hint: h("div"), people: h("div"), filterNote: h("div"), list: h("div"), seg
  };
  put($app, 
    h("div", { class: "topbar" },
      h("a", { class: "back", href: "#/", html: ICON.back + "<span>Trips</span>" }),
      slots.status,
      h("button", { type: "button", class: "icon-btn", "aria-label": "Share this list", onclick: shareTrip, html: ICON.share }),
      h("button", { type: "button", class: "icon-btn", "aria-label": "Trip settings", onclick: openTripSheet, html: ICON.sliders }),
      meChip()),
    slots.tag, slots.notes, slots.hint, slots.people,
    h("div", { class: "toolbar" }, seg, h("div", { class: "search", html: ICON.search }, search), slots.filterNote),
    slots.list,
    h("button", { type: "button", class: "fab", "aria-label": "Add an item", onclick: () => openItemSheet(null), html: ICON.plus })
  );
  slots.tag.append(h("div", { class: "tag" }, h("div", { class: "tag-from" }, "Loading…"), h("div", { class: "tag-to" }, " ")));
}

function renderTrip() {
  if (S.route !== "trip") return;
  const t = S.trip;
  if (S.tripMissing) {
    put(slots.tag); put(slots.people);
    put(slots.list, h("div", { class: "empty" }, h("span", { class: "em" }, "🧳"), h("b", null, "This trip isn't here"), "It may have been deleted. ", h("a", { href: "#/" }, "Back to trips")));
    return;
  }
  if (!t) return;
  document.title = `${t.to} – Tagalong`;
  const total = S.items.length, done = S.items.filter(isDone).length, pct = total ? done / total : 0;

  // Luggage tag
  put(slots.tag, h("div", { class: "tag" },
    h("div", { class: "tag-from" }, t.from ? `From ${t.from}` : "Trip"),
    h("h1", { class: "tag-to", style: "margin-top:4px" }, t.to || "Untitled trip"),
    h("div", { class: "tag-when" }, h("span", null, fmtRange(t.start, t.end)), countdown(t.start, t.end) ? h("span", { class: "countdown" }, countdown(t.start, t.end)) : null),
    h("div", { class: "tag-progress" },
      h("div", { class: "line" },
        h("span", null, h("span", { class: "big" }, String(done)), ` of ${total} packed`),
        h("span", null, total ? (done === total ? "All packed" : `${Math.round(pct * 100)}%`) : "")),
      h("div", { class: "bar", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": String(total), "aria-valuenow": String(done), "aria-label": "Packing progress" },
        h("i", { style: `width:${pct * 100}%` })))));

  put(slots.notes, t.notes ? h("p", { class: "trip-notes" }, t.notes) : "");

  // First-run hint
  const needsNames = (t.travelers || []).some((x) => PLACEHOLDER_NAMES.has(x.name)) && !lsGet("tagalong-hint-" + t.id);
  put(slots.hint, needsNames ? h("div", { class: "hint" },
    h("div", { class: "grow" }, h("p", null, "Add the kids' names so each of them gets their own checklist."),
      h("button", { type: "button", class: "btn small yellow", onclick: openTripSheet }, "Add names")),
    h("button", { type: "button", class: "icon-btn", "aria-label": "Dismiss", html: ICON.close, onclick: () => { lsSet("tagalong-hint-" + t.id, "1"); renderTrip(); } })) : "");

  // Travelers
  put(slots.people, h("div", { class: "people" }, (t.travelers || []).map((tr) => {
    const mine = S.items.filter((it) => keysFor(it).includes(tr.id));
    const got = mine.filter((it) => it.packed && it.packed[tr.id]).length;
    const left = mine.length - got, p = mine.length ? got / mine.length * 100 : 0, on = S.tf === tr.id;
    return h("button", { type: "button", class: "person" + (on ? " on" : ""), style: `--c:${tr.color};--p:${p}`, "aria-pressed": String(on),
      "aria-label": `${tr.name}: ${left} left to pack. Show only ${tr.name}'s things`,
      onclick: () => { S.tf = on ? null : tr.id; renderTrip(); } },
      h("span", { class: "ring" }, h("span", { class: "av" }, initial(tr.name))),
      h("span", { class: "pname" }, tr.name),
      h("span", { class: "pleft" + (mine.length && !left ? " done" : "") }, !mine.length ? "No items" : left ? `${left} left` : "All set"));
  })));

  // Toolbar state
  slots.seg.querySelectorAll("button").forEach((b) => { const on = b.dataset.v === S.filter; b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on)); });
  const tfT = S.tf && traveler(S.tf);
  if (S.tf && !tfT) S.tf = null;
  put(slots.filterNote, tfT ? h("div", { class: "filter-note", style: `--c:${tfT.color}` },
    h("b", null, `Only ${tfT.name}'s things`), h("button", { type: "button", class: "textbtn", onclick: () => { S.tf = null; renderTrip(); } }, "Show everyone")) : "");

  slots.status.textContent = S.store.mode === "cloud" && S.pending ? "Saving…" : "";
  drawList();

  // Save a summary on the trip for the home screen, and celebrate a finished list
  if (S.itemsReady) {
    const st = t.stats || {};
    if (st.packed !== done || st.total !== total) {
      clearTimeout(S.statsTimer);
      S.statsTimer = setTimeout(() => write(S.store.updateTrip(S.tripId, { stats: { packed: done, total } })), 900);
    }
    if (S.lastPct !== null && S.lastPct < 1 && pct === 1 && total) celebrate();
    S.lastPct = pct;
  }
  S.justToggled = null;
}

function drawList() {
  const t = S.trip;
  if (!S.itemsReady) { put(slots.list, h("p", { class: "empty" }, "Loading the list…")); return; }
  const q = S.q.trim().toLowerCase();
  const known = new Set((t.categories || []).map((c) => c.id));
  const cats = [...(t.categories || [])];
  if (S.items.some((i) => !known.has(i.cat))) cats.push({ id: "__other", name: "Other", icon: "📦" });
  const filtering = q || S.filter !== "all" || S.tf;
  const out = [];
  for (const c of cats) {
    let its = S.items.filter((i) => c.id === "__other" ? !known.has(i.cat) : i.cat === c.id).sort(byOrder);
    if (S.tf) its = its.filter((i) => keysFor(i).includes(S.tf));
    const total = its.length, done = its.filter(isDoneView).length;
    let shown = its.filter((i) => S.filter === "todo" ? !isDoneView(i) : S.filter === "packed" ? isDoneView(i) : true);
    if (q) shown = shown.filter((i) => `${i.name} ${i.note || ""} ${i.bag || ""}`.toLowerCase().includes(q));
    if (filtering && !shown.length) continue;
    const collapsed = !!S.collapsed[c.id] && !q;
    out.push(h("section", { class: "cat" + (collapsed ? " collapsed" : "") },
      h("button", { type: "button", class: "cat-head", "aria-expanded": String(!collapsed),
        onclick: () => { S.collapsed[c.id] = !collapsed; lsSet("tagalong-collapsed-" + S.tripId, JSON.stringify(S.collapsed)); drawList(); } },
        h("span", { class: "cat-icon", "aria-hidden": "true" }, c.icon || "📦"),
        h("span", { class: "cat-name" }, c.name),
        h("span", { class: "cat-count" + (total && done === total ? " done" : "") }, !total ? "Empty" : done === total ? "Done" : `${done} of ${total}`),
        h("span", { html: ICON.chev })),
      collapsed ? null : h("div", { class: "cat-body" },
        shown.map(itemRow),
        c.id !== "__other" && !q ? h("button", { type: "button", class: "add-row", onclick: () => openItemSheet(null, c.id), html: ICON.plus + `<span></span>` }) : null)));
  }
  // Fill the "Add to …" labels safely as text
  out.forEach((sec, i) => { const span = sec.querySelector(".add-row span"); if (span) span.textContent = `Add to ${sec.querySelector(".cat-name").textContent}`; });

  if (!out.length) {
    const msg = q ? ["🔎", "No matches", `Nothing on this list matches “${S.q.trim()}”.`]
      : S.filter === "todo" ? ["🎉", "Nothing left to pack", S.tf ? `${traveler(S.tf).name} is all set.` : "Zip it up. You're ready to go."]
      : S.filter === "packed" ? ["🧳", "Nothing packed yet", "Tap the circle next to an item when it's in a bag."]
      : ["📝", "This list is empty", "Add your first item with the + button."];
    put(slots.list, h("div", { class: "empty" }, h("span", { class: "em" }, msg[0]), h("b", null, msg[1]), msg[2]));
    return;
  }
  put(slots.list, ...out);
}

function itemRow(it) {
  const keys = keysFor(it), vk = viewKeys(it);
  const got = vk.filter((k) => it.packed && it.packed[k]).length;
  const done = got === vk.length, partial = !done && got > 0;
  const many = !S.tf && keys[0] !== "shared" && keys.length > 1;
  const meta = [];
  if (it.qty > 1) meta.push(h("span", { class: "qty" }, many ? `${it.qty} each` : `×${it.qty}`));
  if (it.bag) meta.push(h("span", { class: "bag" }, it.bag));
  if (vk.length === 1 && done && typeof it.packed[vk[0]] === "string" && (keys[0] === "shared" || S.tf)) meta.push(h("span", { class: "by" }, `Packed by ${it.packed[vk[0]]}`));
  const open = () => openItemSheet(it);
  return h("div", { class: `item${done ? " done" : ""}${partial ? " partial" : ""}${S.justToggled === it.id ? " pop" : ""}`, style: `--p:${Math.round(got / vk.length * 100)}` },
    h("button", { type: "button", class: "check", html: ICON.tick, "aria-pressed": String(done),
      "aria-label": `${it.name}: ${done ? "packed" : partial ? "partly packed" : "not packed"}`, onclick: () => toggle(it, vk) }),
    h("div", { class: "col" },
      h("div", { class: "main", role: "button", tabindex: "0", "aria-label": `Edit ${it.name}`, onclick: open, onkeydown: (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } } },
        h("div", { class: "iname" }, it.name),
        meta.length ? h("div", { class: "imeta" }, meta) : null,
        it.note ? h("div", { class: "inote" }, it.note) : null),
      many ? h("div", { class: "chips" }, keys.map((k) => {
        const tr = traveler(k), on = !!(it.packed && it.packed[k]);
        return h("button", { type: "button", class: "pchip" + (on ? " on" : ""), style: `--c:${tr.color}`, "aria-pressed": String(on),
          "aria-label": `${tr.name}: ${on ? "packed" : "not packed"}`, onclick: () => toggle(it, [k]) },
          h("span", { class: "dot", html: on ? ICON.tick : null }, on ? null : initial(tr.name)), h("span", null, tr.name));
      })) : null));
}

/* ── Sheets ────────────────────────────────────────────────── */
function openSheet(title, body, foot) {
  const dlg = h("dialog", { class: "sheet", "aria-label": title });
  const close = () => { if (dlg.open) dlg.close(); };
  dlg.append(h("div", { class: "sheet-inner" },
    h("div", { class: "sheet-head" }, h("h2", null, title), h("button", { type: "button", class: "icon-btn", "aria-label": "Close", html: ICON.close, onclick: close })),
    h("div", { class: "sheet-body" }, body), foot ? h("div", { class: "sheet-foot" }, foot) : null));
  dlg.addEventListener("close", () => dlg.remove());
  dlg.addEventListener("click", (e) => { if (e.target === dlg) close(); });
  document.body.append(dlg);
  dlg.showModal();
  return { dlg, close };
}

function askConfirm(title, text, okLabel, danger) {
  return new Promise((resolve) => {
    let answered = false;
    const s = openSheet(title, h("p", null, text), [
      h("button", { type: "button", class: "btn ghost", onclick: () => s.close() }, "Cancel"),
      h("button", { type: "button", class: "btn" + (danger ? " danger" : ""), onclick: () => { answered = true; s.close(); } }, okLabel)
    ]);
    s.dlg.addEventListener("close", () => resolve(answered));
  });
}

function field(label, control, help, id) {
  return h("div", { class: "field" }, h("label", { for: id }, label), help ? h("p", { class: "help" }, help) : null, control);
}

function personChip(label, on, color, mark, onclick) {
  return h("button", { type: "button", class: "pchip" + (on ? " on" : ""), style: `--c:${color}`, "aria-pressed": String(on), onclick },
    h("span", { class: "dot", html: on ? ICON.tick : null }, on ? null : mark), h("span", null, label));
}

/* Add / edit an item */
function openItemSheet(item, presetCat) {
  const t = S.trip; if (!t) return;
  const isNew = !item;
  const st = { who: item ? (Array.isArray(item.who) ? item.who.filter((id) => traveler(id)) : "shared") : (S.tf ? [S.tf] : "shared"), qty: item ? item.qty || 1 : 1 };
  if (Array.isArray(st.who) && !st.who.length) st.who = "shared";
  const cats = t.categories || [];

  const name = h("input", { id: "f-name", value: item ? item.name : "", maxlength: "120", placeholder: "What needs to come?", autocomplete: "off", enterkeyhint: "done" });
  const catSel = h("select", { id: "f-cat" }, cats.map((c) => h("option", { value: c.id }, `${c.icon || "📦"}  ${c.name}`)), h("option", { value: "__new" }, "+ New category…"));
  catSel.value = (item && cats.some((c) => c.id === item.cat)) ? item.cat : presetCat || (cats[0] && cats[0].id) || "__new";
  const newCat = h("input", { id: "f-newcat", maxlength: "40", placeholder: "e.g. Snacks for the drive" });
  const newCatWrap = field("New category name", newCat, null, "f-newcat");
  newCatWrap.hidden = catSel.value !== "__new";
  catSel.onchange = () => { newCatWrap.hidden = catSel.value !== "__new"; if (!newCatWrap.hidden) newCat.focus(); };

  const whoBox = h("div", { class: "chips" });
  const num = h("span", { class: "num" }), totalEl = h("span", { class: "total" }), qtyLabel = h("span");
  const kids = t.travelers.filter((x) => x.kind === "kid").map((x) => x.id);
  const adults = t.travelers.filter((x) => x.kind === "adult").map((x) => x.id);
  const same = (a, b) => Array.isArray(a) && a.length === b.length && b.every((id) => a.includes(id));
  function drawWho() {
    put(whoBox, 
      personChip("Whole family", st.who === "shared", "#56657E", "★", () => { st.who = "shared"; drawWho(); }),
      kids.length > 1 ? personChip("Each kid", same(st.who, kids), "#56657E", "K", () => { st.who = [...kids]; drawWho(); }) : null,
      adults.length > 1 ? personChip("Each adult", same(st.who, adults), "#56657E", "A", () => { st.who = [...adults]; drawWho(); }) : null,
      t.travelers.map((tr) => personChip(tr.name, Array.isArray(st.who) && st.who.includes(tr.id), tr.color, initial(tr.name), () => {
        if (st.who === "shared") st.who = [tr.id];
        else { st.who = st.who.includes(tr.id) ? st.who.filter((x) => x !== tr.id) : [...st.who, tr.id]; if (!st.who.length) st.who = "shared"; }
        drawWho();
      })));
    drawQty();
  }
  function drawQty() {
    const n = Array.isArray(st.who) ? st.who.length : 1;
    num.textContent = String(st.qty);
    qtyLabel.textContent = n > 1 ? "How many per person" : "How many";
    totalEl.textContent = n > 1 ? `${st.qty * n} in all` : "";
  }
  const stepper = h("div", { class: "stepper" },
    h("button", { type: "button", "aria-label": "One fewer", onclick: () => { st.qty = Math.max(1, st.qty - 1); drawQty(); } }, "−"),
    num,
    h("button", { type: "button", "aria-label": "One more", onclick: () => { st.qty = Math.min(99, st.qty + 1); drawQty(); } }, "+"),
    totalEl);
  drawWho();

  const bagNames = [...new Set([...(t.bags || BAGS), ...S.items.map((i) => i.bag).filter(Boolean)])];
  const bagIn = h("input", { id: "f-bag", list: "bag-options", value: item ? item.bag || "" : "", maxlength: "40", placeholder: "Carry-on, checked bag…" });
  const bagList = h("datalist", { id: "bag-options" }, bagNames.map((b) => h("option", { value: b })));
  const noteIn = h("textarea", { id: "f-note", rows: "2", maxlength: "300", placeholder: "Anything worth remembering" });
  noteIn.value = item ? item.note || "" : "";

  function save() {
    const nm = name.value.trim();
    if (!nm) { name.classList.add("invalid"); name.focus(); return; }
    let cat = catSel.value; const tripPatch = {};
    if (cat === "__new") {
      const cn = newCat.value.trim();
      if (!cn) { newCat.classList.add("invalid"); newCat.focus(); return; }
      const ex = cats.find((c) => c.name.toLowerCase() === cn.toLowerCase());
      if (ex) cat = ex.id; else { cat = rid("c"); tripPatch.categories = [...cats, { id: cat, name: cn, icon: "📦" }]; }
    }
    const bag = bagIn.value.trim();
    if (bag && !(t.bags || BAGS).includes(bag)) tripPatch.bags = [...(t.bags || BAGS), bag];
    if (Object.keys(tripPatch).length) write(S.store.updateTrip(t.id, tripPatch));
    const data = { name: nm, cat, qty: st.qty, who: st.who, bag, note: noteIn.value.trim() };
    const nextOrder = () => S.items.filter((i) => i.cat === cat).reduce((m, i) => Math.max(m, i.order || 0), 0) + 10;
    if (S.collapsed[cat]) { S.collapsed[cat] = false; lsSet("tagalong-collapsed-" + S.tripId, JSON.stringify(S.collapsed)); }
    if (isNew) {
      write(S.store.addItem(t.id, rid("i"), { ...data, packed: {}, order: nextOrder() }));
      toast(`Added ${nm}`);
    } else {
      const keep = Array.isArray(data.who) ? data.who : ["shared"], packed = {};
      for (const k of keep) if (item.packed && item.packed[k]) packed[k] = item.packed[k];
      if (item.cat !== cat) data.order = nextOrder();
      write(S.store.updateItem(t.id, item.id, { ...data, packed }));
      toast("Saved");
    }
    s.close();
  }
  name.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); save(); } });

  const s = openSheet(isNew ? "Add an item" : "Edit item", [
    field("Item", name, null, "f-name"),
    field("Category", catSel, null, "f-cat"), newCatWrap,
    h("div", { class: "field" }, h("span", { class: "label" }, "Who's it for?"), h("p", { class: "help" }, "Pick people to give each of them a checkmark."), whoBox),
    h("div", { class: "field" }, h("span", { class: "label" }, qtyLabel), stepper),
    field("Bag", bagIn, null, "f-bag"), bagList,
    field("Note", noteIn, null, "f-note")
  ], [
    isNew ? null : h("button", { type: "button", class: "del-link", onclick: () => {
      s.close();
      write(S.store.deleteItem(t.id, item.id));
      const { id, ...copy } = item;
      toast(`Removed ${item.name}`, { label: "Undo", run: () => write(S.store.addItem(t.id, id, copy)) });
    } }, "Remove"),
    h("button", { type: "button", class: "btn ghost", onclick: () => s.close() }, "Cancel"),
    h("button", { type: "button", class: "btn", onclick: save }, isNew ? "Add item" : "Save")
  ]);
  if (isNew) setTimeout(() => name.focus(), 60);
}

/* Traveler editor used by trip settings and new trip */

/* Trip settings */
function openTripSheet() {
  const t = S.trip; if (!t) return;
  const travelers = (t.travelers || []).map((x) => ({ ...x }));
  const to = h("input", { id: "s-to", value: t.to || "", maxlength: "60" });
  const from = h("input", { id: "s-from", value: t.from || "", maxlength: "60" });
  const start = h("input", { id: "s-start", type: "date", value: t.start || "" });
  const end = h("input", { id: "s-end", type: "date", value: t.end || "" });
  const notes = h("textarea", { id: "s-notes", rows: "3", maxlength: "500" }); notes.value = t.notes || "";

  function save() {
    const list = travelers.map((x) => ({ ...x, name: x.name.trim() || "Traveler" }));
    const gone = new Set((t.travelers || []).map((x) => x.id).filter((id) => !list.some((x) => x.id === id)));
    if (gone.size) {
      const ops = S.items.filter((it) => Array.isArray(it.who) && it.who.some((id) => gone.has(id))).map((it) => {
        const who = it.who.filter((id) => !gone.has(id)); const packed = { ...(it.packed || {}) }; gone.forEach((id) => delete packed[id]);
        return { id: it.id, patch: { who: who.length ? who : "shared", packed } };
      });
      if (ops.length) write(S.store.bulk(t.id, ops));
    }
    write(S.store.updateTrip(t.id, { to: to.value.trim() || "Untitled trip", from: from.value.trim(), start: start.value, end: end.value, notes: notes.value.trim(), travelers: list }));
    s.close(); toast("Trip saved");
  }
  const s = openSheet("Trip settings", [
    field("Going to", to, null, "s-to"),
    field("Leaving from", from, null, "s-from"),
    h("div", { class: "row2" }, field("Leave", start, null, "s-start"), field("Return", end, null, "s-end")),
    field("Notes for everyone", notes, "Weather, flight times, where you're staying.", "s-notes"),
    h("div", { class: "field" }, h("span", { class: "label" }, "Who's going"), h("p", { class: "help" }, "Kids and adults each get their own checkmarks on things like clothes."), travelerEditor(travelers)),
    h("hr", { class: "divider" }),
    h("div", { class: "danger-zone" },
      h("button", { type: "button", class: "btn ghost", onclick: () => { s.close(); openCategorySheet(); } }, "Edit categories"),
      h("button", { type: "button", class: "btn ghost", onclick: async () => {
        s.close();
        if (!(await askConfirm("Uncheck everything?", "Every item goes back to unpacked. Handy when you repack for the trip home.", "Uncheck everything"))) return;
        write(S.store.bulk(t.id, S.items.filter((i) => i.packed && Object.keys(i.packed).length).map((i) => ({ id: i.id, patch: { packed: {} } }))));
        S.lastPct = 0; toast("Everything is unchecked");
      } }, "Uncheck everything"),
      h("button", { type: "button", class: "btn ghost", style: "color:var(--danger)", onclick: async () => {
        s.close();
        if (!(await askConfirm("Delete this trip?", `${t.to} and all ${S.items.length} items will be deleted for everyone. This can't be undone.`, "Delete trip", true))) return;
        write(S.store.deleteTrip(t.id)); location.hash = "#/"; toast("Trip deleted");
      } }, "Delete trip"))
  ], [
    h("button", { type: "button", class: "btn ghost", onclick: () => s.close() }, "Cancel"),
    h("button", { type: "button", class: "btn", onclick: save }, "Save trip")
  ]);
}

/* Categories */
function openCategorySheet() {
  const t = S.trip; if (!t) return;
  const cats = (t.categories || []).map((c) => ({ ...c }));
  let picking = null;
  const box = h("div");
  function draw() {
    put(box, 
      ...cats.map((c, i) => {
        const n = S.items.filter((it) => it.cat === c.id).length;
        return [h("div", { class: "ce-row" },
          h("button", { type: "button", class: "ce-emoji", "aria-label": `Change icon for ${c.name || "category"}`, "aria-expanded": String(picking === c.id), onclick: () => { picking = picking === c.id ? null : c.id; draw(); } }, c.icon || "📦"),
          h("input", { value: c.name, maxlength: "40", placeholder: "Category name", "aria-label": `Category name, ${plural(n, "item")}`, oninput: (e) => { c.name = e.target.value; } }),
          h("button", { type: "button", class: "icon-btn", "aria-label": "Move up", disabled: i === 0, html: ICON.up, onclick: () => { [cats[i - 1], cats[i]] = [cats[i], cats[i - 1]]; draw(); } }),
          h("button", { type: "button", class: "icon-btn", "aria-label": "Move down", disabled: i === cats.length - 1, html: ICON.down, onclick: () => { [cats[i + 1], cats[i]] = [cats[i], cats[i + 1]]; draw(); } }),
          h("button", { type: "button", class: "icon-btn", "aria-label": `Delete ${c.name || "category"}`, html: ICON.trash, onclick: () => { cats.splice(i, 1); draw(); } })),
        picking === c.id ? h("div", { class: "emoji-grid" }, EMOJI.map((e) => h("button", { type: "button", "aria-label": `Use ${e}`, onclick: () => { c.icon = e; picking = null; draw(); } }, e))) : null];
      }),
      h("button", { type: "button", class: "btn ghost small", style: "margin-top:12px", onclick: () => {
        const c = { id: rid("c"), name: "", icon: "📦" }; cats.push(c); picking = null; draw();
        const ins = box.querySelectorAll(".ce-row input"); ins[ins.length - 1].focus();
      } }, "Add a category"));
  }
  draw();
  async function save() {
    const keep = cats.filter((c) => c.name.trim()).map((c) => ({ ...c, name: c.name.trim() }));
    const removed = (t.categories || []).filter((c) => !keep.some((k) => k.id === c.id));
    const doomed = S.items.filter((it) => removed.some((r) => r.id === it.cat));
    s.close();
    if (doomed.length && !(await askConfirm("Delete items too?", `Deleting ${removed.map((r) => r.name).join(", ")} also removes ${plural(doomed.length, "item")} in ${removed.length > 1 ? "them" : "it"}.`, "Delete", true))) return;
    if (doomed.length) write(S.store.bulk(t.id, doomed.map((d) => ({ id: d.id, del: true }))));
    write(S.store.updateTrip(t.id, { categories: keep }));
    toast("Categories saved");
  }
  const s = openSheet("Categories", [h("p", null, "Rename, reorder or add categories. Tap an icon to change it."), box], [
    h("button", { type: "button", class: "btn ghost", onclick: () => s.close() }, "Cancel"),
    h("button", { type: "button", class: "btn", onclick: save }, "Save categories")
  ]);
}

/* New trip */
function openNewTripSheet() {
  const last = [...S.trips].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))[0];
  const travelers = ((last && last.travelers) || DEFAULT_TRAVELERS).map((x) => ({ ...x }));
  const to = h("input", { id: "n-to", maxlength: "60", placeholder: "Where are you going?" });
  const from = h("input", { id: "n-from", maxlength: "60", value: (last && last.from) || "" });
  const start = h("input", { id: "n-start", type: "date" });
  const end = h("input", { id: "n-end", type: "date" });
  const templateRows = SEED.filter(([c]) => !CATEGORIES.find((x) => x.id === c).tripOnly);
  const radio = (v, title, sub, checked) => h("label", { class: "choice" }, h("input", { type: "radio", name: "tpl", value: v, checked }), h("div", null, h("b", null, title), h("span", null, sub)));
  const choices = h("div", null,
    radio("family", "Family essentials", "Clothes, toiletries, carry-on and more, sized for each person. Edit anything after.", true),
    radio("blank", "Start empty", "Build the list yourself.", false));
  function create() {
    const dest = to.value.trim();
    if (!dest) { to.classList.add("invalid"); to.focus(); return; }
    const list = travelers.map((x) => ({ ...x, name: x.name.trim() || "Traveler" }));
    const tpl = choices.querySelector("input:checked").value;
    const items = tpl === "family" ? buildItems(templateRows, list, false) : [];
    const used = new Set(items.map(([, it]) => it.cat));
    const categories = tpl === "family" ? cleanCats(CATEGORIES.filter((c) => used.has(c.id)))
      : [{ id: "c_clothes", name: "Clothes", icon: "👕" }, { id: "c_toilet", name: "Toiletries", icon: "🪥" }, { id: "c_carry", name: "Carry-on", icon: "🎒" }];
    const id = (dest.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 30) || "trip") + "-" + Math.random().toString(36).slice(2, 6);
    write(S.store.createTrip(id, { to: dest, from: from.value.trim(), start: start.value, end: end.value || start.value, notes: "", travelers: list, categories, bags: BAGS, createdAt: Date.now() }, items));
    s.close();
    location.hash = `#/trip/${id}`;
  }
  const s = openSheet("Plan a new trip", [
    field("Going to", to, null, "n-to"),
    field("Leaving from", from, null, "n-from"),
    h("div", { class: "row2" }, field("Leave", start, null, "n-start"), field("Return", end, null, "n-end")),
    h("div", { class: "field" }, h("span", { class: "label" }, "Who's going"), travelerEditor(travelers)),
    h("div", { class: "field" }, h("span", { class: "label" }, "Start with"), choices)
  ], [
    h("button", { type: "button", class: "btn ghost", onclick: () => s.close() }, "Cancel"),
    h("button", { type: "button", class: "btn", onclick: create }, "Create trip")
  ]);
  setTimeout(() => to.focus(), 60);
}

/* Who's packing on this phone */
function openMeSheet() {
  const source = S.trip ? S.trip.travelers : S.trips.flatMap((t) => t.travelers || []);
  const adults = [...new Set((source || []).filter((x) => x.kind === "adult" && x.name).map((x) => x.name))];
  const input = h("input", { id: "me-name", maxlength: "24", value: S.me, placeholder: "Your first name", autocomplete: "given-name" });
  const set = (name) => {
    const v = (name || "").trim(); if (!v) { input.classList.add("invalid"); input.focus(); return; }
    S.me = v; lsSet("tagalong-me", v); s.close(); toast(`Packing as ${v}`);
    S.route === "home" ? renderHome() : buildShellAndRender();
  };
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); set(input.value); } });
  const s = openSheet("Who's packing on this phone?", [
    h("p", null, "Your name shows on the things you pack, so everyone knows what's already in a bag."),
    adults.length ? h("div", { class: "name-pick" }, adults.map((n) => h("button", { type: "button", class: "btn ghost small", onclick: () => set(n) }, n))) : null,
    field(adults.length ? "Or type your name" : "Your name", input, null, "me-name")
  ], [h("button", { type: "button", class: "btn", onclick: () => set(input.value) }, "Save name")]);
}
function buildShellAndRender() {
  const q = S.q; buildShell(); S.q = q; const si = $app.querySelector(".search input"); if (si) si.value = q; renderTrip();
}

/* Share */
async function shareTrip() {
  if (S.store.mode === "local") { toast("Add your Firebase settings first so your family sees the same list."); return; }
  const url = location.href, title = `${S.trip ? S.trip.to : "Trip"} packing list`;
  try {
    if (navigator.share) { await navigator.share({ title, url }); return; }
    await navigator.clipboard.writeText(url); toast("Link copied");
  } catch (e) { if (e.name !== "AbortError") toast("Copy the link from the address bar to share it."); }
}

/* Finished-list celebration */
function celebrate() {
  toast("Everything's packed. Have a great trip!");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = h("canvas", { id: "confetti" }); document.body.append(cv);
  const ctx = cv.getContext("2d"), dpr = devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const colors = ["#F7C531", ...((S.trip && S.trip.travelers) || []).map((t) => t.color), "#17936A"];
  const bits = Array.from({ length: 150 }, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * 80, y: innerHeight * .35, vx: (Math.random() - .5) * 13, vy: -Math.random() * 13 - 4,
    w: 6 + Math.random() * 6, h: 9 + Math.random() * 8, r: Math.random() * 6, vr: (Math.random() - .5) * .35, c: colors[Math.floor(Math.random() * colors.length)]
  }));
  const t0 = performance.now();
  (function frame(now) {
    const k = now - t0; ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const b of bits) {
      b.vy += .32; b.vx *= .99; b.x += b.vx; b.y += b.vy; b.r += b.vr;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.globalAlpha = Math.max(0, 1 - k / 2400); ctx.fillStyle = b.c; ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); ctx.restore();
    }
    if (k < 2400) requestAnimationFrame(frame); else cv.remove();
  })(t0);
}

/* ── Start ─────────────────────────────────────────────────── */
async function main() {
  const configured = FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && !/^(YOUR|…)/.test(FIREBASE_CONFIG.apiKey);
  if (configured) {
    try { S.store = await FirebaseStore(FIREBASE_CONFIG); }
    catch (e) { console.error(e); S.store = LocalStore(); toast("Couldn't reach Firebase, so this phone is saving on its own for now."); }
  } else S.store = LocalStore();

  S.store.watchTrips((trips, meta) => {
    S.trips = trips; S.tripsReady = true;
    const seededKey = "tagalong-seeded-" + S.store.mode;
    if (!trips.length && !(meta && meta.fromCache) && !lsGet(seededKey)) { lsSet(seededKey, "1"); seedFirstTrip(); }
    renderHome();
  }, onErr);
  window.addEventListener("hashchange", route);
  route();
}
main();
</script>
